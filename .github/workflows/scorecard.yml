name: OpenSSF Scorecard

on:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Link report in job summary
        run: |
          {
            echo "## OpenSSF Scorecard"
            echo ""
            echo "Results published. View the full report here:"
            echo ""
            echo "**[scorecard.dev/viewer/?uri=github.com/${{ github.repository }}](https://scorecard.dev/viewer/?uri=github.com/${{ github.repository }})**"
            echo ""
            echo "_Note: the public API can take a few minutes to reflect this run._"
          } >> "$GITHUB_STEP_SUMMARY"
